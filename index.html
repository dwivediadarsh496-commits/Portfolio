<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Adarsh Dwivedi — AI/ML Developer</title>
    <style>
        :root {
            --bg: #05060d;
            --card: #0a0e22;
            --bd: #1e2650;
            --tx: #e8edff;
            --mu: #8fa0cc;
            --ac: #22d3ee;
            --ac2: #b45cff
        }

        * {
            box-sizing: border-box;
            margin: 0
        }

        body {
            background: radial-gradient(800px 520px at 0% 0%, #0891b244, transparent 60%), radial-gradient(900px 600px at 100% 35%, #7c3aed40, transparent 60%), radial-gradient(800px 500px at 25% 100%, #be185d30, transparent 60%), #05060d;
            background-attachment: fixed;
            color: var(--tx);
            font: 15px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
            min-height: 100vh
        }

        a {
            color: inherit;
            text-decoration: none
        }

        nav {
            position: sticky;
            top: 0;
            z-index: 9;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 12px 5vw;
            background: #05060ddd;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--bd);
            flex-wrap: wrap
        }

        nav b {
            margin-right: auto;
            font-size: 15px
        }

        nav a.l {
            padding: 6px 10px;
            border-radius: 8px;
            color: var(--mu);
            font-size: 13px
        }

        nav a.l.on,
        nav a.l:hover {
            color: #fff;
            background: #22d3ee1f;
            box-shadow: inset 0 -2px var(--ac)
        }

        main {
            max-width: 1080px;
            margin: 0 auto;
            padding: 36px 5vw 60px
        }

        h1 {
            font-size: clamp(30px, 5vw, 46px);
            line-height: 1.15
        }

        h2 {
            font-size: 22px;
            margin: 34px 0 14px
        }

        h3 {
            font-size: 16px
        }

        .g {
            background: linear-gradient(90deg, #22d3ee, #b45cff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent
        }

        .mu {
            color: var(--mu)
        }

        .sub {
            color: var(--mu);
            margin: 6px 0 22px
        }

        .card {
            background: var(--card);
            border: 1px solid var(--bd);
            border-radius: 14px;
            padding: 18px
        }

        .grid {
            display: grid;
            gap: 16px;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr))
        }

        .btn {
            display: inline-block;
            padding: 9px 18px;
            border-radius: 9px;
            border: 1px solid var(--bd);
            font-size: 14px;
            cursor: pointer;
            color: var(--tx);
            background: transparent;
            font-family: inherit
        }

        .btn.p {
            background: linear-gradient(90deg, #0ea5e9, #a855f7);
            border: 0
        }

        .chip {
            display: inline-block;
            padding: 3px 11px;
            border-radius: 99px;
            border: 1px solid var(--bd);
            background: #121a3d;
            font-size: 12px;
            color: #b9c6f5;
            margin: 3px 4px 3px 0;
            cursor: default
        }

        button.chip {
            cursor: pointer;
            font-family: inherit
        }

        button.chip.on {
            background: var(--ac);
            color: #04121f;
            border-color: var(--ac)
        }

        .hero {
            display: grid;
            gap: 30px;
            grid-template-columns: 1.2fr 1fr;
            align-items: center;
            padding: 20px 0
        }

        .orb {
            aspect-ratio: 1;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #3b63f0, #0a1330 60%, #05060d);
            display: grid;
            place-items: center;
            font-size: 110px;
            box-shadow: 0 0 90px #7c5cff66;
            max-width: 340px;
            justify-self: center;
            width: 100%
        }

        .orb {
            overflow: hidden;
            border: 3px solid #22d3ee88
        }

        .orb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 20%
        }

        .card svg {
            flex: none
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-top: 30px
        }

        .stats b {
            font-size: 26px;
            display: block
        }

        .cover {
            height: 110px;
            border-radius: 10px;
            display: grid;
            place-items: center;
            font-size: 44px;
            margin-bottom: 12px
        }

        .pc {
            cursor: pointer;
            transition: .2s
        }

        .pc:hover {
            transform: translateY(-3px);
            border-color: var(--ac)
        }

        .tl {
            border-left: 2px solid var(--bd);
            padding-left: 22px;
            margin-left: 8px
        }

        .tl .card {
            margin-bottom: 16px;
            position: relative
        }

        .tl .card:before {
            content: "";
            position: absolute;
            left: -30px;
            top: 22px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--ac);
            box-shadow: 0 0 12px var(--ac)
        }

        ul {
            padding-left: 18px
        }

        li {
            margin: 4px 0;
            color: #c4cfee
        }

        .two {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 18px
        }

        .flow {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap
        }

        .flow .card {
            flex: 1;
            min-width: 130px;
            text-align: center;
            font-size: 13px
        }

        input,
        textarea {
            width: 100%;
            padding: 10px 12px;
            margin: 6px 0 14px;
            background: #080b1c;
            border: 1px solid var(--bd);
            border-radius: 8px;
            color: var(--tx);
            font: inherit
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px
        }

        td {
            padding: 8px 4px;
            border-bottom: 1px solid var(--bd)
        }

        td a {
            color: #67e8f9;
            margin-right: 12px
        }

        footer {
            text-align: center;
            color: var(--mu);
            font-size: 13px;
            padding: 26px;
            border-top: 1px solid var(--bd)
        }

        @media(max-width:760px) {

            .hero,
            .two {
                grid-template-columns: 1fr
            }

            .stats {
                grid-template-columns: repeat(2, 1fr)
            }
        }

        .cv {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 2.4;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 12px
        }

        .cv.big {
            max-width: 600px;
            margin: 0 0 6px
        }

        .orb {
            border-radius: 30px;
            aspect-ratio: 3/4;
            max-width: 320px;
            width: 100%;
            border: 0;
            padding: 2px;
            background: linear-gradient(135deg, #22d3ee, #b45cff);
            box-shadow: 0 0 40px #7c5cff33
        }

        .orb img {
            width: 100%;
            height: 100%;
            border-radius: 28px;
            object-fit: cover;
            object-position: center;
            display: block
        }

        .fl {
            position: relative;
            justify-self: center;
            width: 100%;
            max-width: 400px;
            padding-bottom: 28px
        }

        .fl img {
            display: block;
            width: 100%;
            height: auto;
            animation: fl 5s ease-in-out infinite;
            -webkit-mask-image: linear-gradient(to right, transparent, #000 12%, #000 88%, transparent), linear-gradient(to bottom, transparent, #000 9%, #000 88%, transparent);
            -webkit-mask-composite: source-in;
            mask-image: linear-gradient(to right, transparent, #000 12%, #000 88%, transparent), linear-gradient(to bottom, transparent, #000 9%, #000 88%, transparent);
            mask-composite: intersect
        }

        .fl .sh {
            position: absolute;
            left: 20%;
            right: 20%;
            bottom: 0;
            height: 22px;
            border-radius: 50%;
            background: radial-gradient(closest-side, #22d3ee66, #7c5cff33 60%, transparent);
            filter: blur(6px);
            animation: sh 5s ease-in-out infinite
        }

        @keyframes fl {

            0%,
            100% {
                transform: translateY(0)
            }

            50% {
                transform: translateY(-16px)
            }
        }

        @keyframes sh {

            0%,
            100% {
                transform: scale(1);
                opacity: .9
            }

            50% {
                transform: scale(.78);
                opacity: .45
            }
        }

        @media(prefers-reduced-motion:reduce) {

            .fl img,
            .fl .sh {
                animation: none
            }
        }

        .fl img {
            mix-blend-mode: screen
        }
    </style>
</head>
